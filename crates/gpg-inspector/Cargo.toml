[package]
name = "gpg-inspector"
version = "0.8.1"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
description = "A TUI for parsing and inspecting OpenPGP (GPG) packets according to RFC 4880 and RFC 9580"
readme = "../../README.md"

[features]
default = ["serde"]
serde = ["dep:serde", "dep:serde_json", "dep:hex"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin_include)'] }

[dependencies]
gpg-inspector-lib = { version = "0.8.1", path = "../gpg-inspector-lib" }
ratatui = { workspace = true }
crossterm = { workspace = true }
color-eyre = { workspace = true }
clap = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
hex = { workspace = true, optional = true }

# rust-ci's release.yml ships assets as `gpg-inspector-{os}-{arch}.{ext}` (no
# version, no full target triple), which matches none of cargo-binstall's
# default guess templates, so `cargo binstall gpg-inspector` silently fell
# back to compiling from source. archive-suffix resolves against every
# extension binstall knows for the given pkg-fmt (both .tgz and .tar.gz for
# Tgz), so this matches the actual .tar.gz assets without hardcoding it.
#
# { name } (crate name), not { bin }: binstall only resolves { bin } later,
# in bin-dir, after a specific binary is known - it isn't available when
# pkg-url renders (confirmed the hard way on edikt 0.2.7). { name } happens
# to equal the binary name here.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ os-name }-{ target-arch }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
